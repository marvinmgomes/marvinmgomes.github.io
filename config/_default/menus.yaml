# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10

  - name: About Me
    url: /#about
    weight: 20

  - name: Publications
    url: /#publications
    weight: 30

  - name: Research
    url: /research/
    weight: 40

  - name: Experience
    url: /experience/
    weight: 50

  - name: Education
    url: /education/
    weight: 60

  - name: CV
    url: /uploads/resume.pdf
    weight: 70

  - name: Contact
    url: /#contact
    weight: 80
